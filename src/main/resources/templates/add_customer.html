<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавление покупателя</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<div class="container">
    <h1>Добавление покупателя</h1>

    <form class="customer-form"
          action="#"
          th:action="@{/customers/add}"
          th:object="${customer}"
          method="post">

        <p class="form-field">
            <label for="lastName">Фамилия:</label>
            <input type="text"
                   id="lastName"
                   placeholder="Введите фамилию"
                   th:field="*{lastName}"
                   required>
        </p>

        <p class="form-field">
            <label for="name">Имя:</label>
            <input type="text"
                   id="name"
                   placeholder="Введите имя"
                   th:field="*{name}"
                   required>
        </p>

        <p class="form-field">
            <label for="patronymic">Отчество:</label>
            <input type="text"
                   id="patronymic"
                   placeholder="Введите отчество"
                   th:field="*{patronymic}"
                   required>
        </p>

        <p class="form-field">
            <label for="gender">Пол:</label>
            <input type="text"
                   id="gender"
                   placeholder="Введите пол"
                   th:field="*{gender}"
                   required>
        </p>

        <p class="form-field">
            <label for="nationality">Национальность:</label>
            <input type="text"
                   id="nationality"
                   placeholder="Введите национальность"
                   th:field="*{nationality}"
                   required>
        </p>

        <p class="form-field">
            <label for="height">Рост:</label>
            <input type="number"
                   id="height"
                   min="1"
                   placeholder="Введите рост"
                   th:field="*{height}"
                   required>
        </p>

        <p class="form-field">
            <label for="weight">Вес:</label>
            <input type="number"
                   id="weight"
                   min="0.1"
                   step="0.1"
                   placeholder="Введите вес"
                   th:field="*{weight}"
                   required>
        </p>

        <p class="form-field">
            <label for="birthDate">Дата рождения:</label>
            <input type="date"
                   id="birthDate"
                   th:field="*{birthDate}"
                   required>
        </p>

        <p class="form-field">
            <label for="phoneNumber">Номер телефона:</label>
            <input type="text"
                   id="phoneNumber"
                   placeholder="Введите номер телефона"
                   th:field="*{phoneNumber}"
                   required>
        </p>

        <p class="form-field">
            <label for="creditCardNumber">Номер кредитной карты:</label>
            <input type="text"
                   id="creditCardNumber"
                   inputmode="numeric"
                   placeholder="Введите номер карты"
                   th:field="*{creditCardNumber}"
                   required>
        </p>

        <p class="form-field">
            <label for="bankAccountNumber">Номер банковского счёта:</label>
            <input type="text"
                   id="bankAccountNumber"
                   inputmode="numeric"
                   placeholder="Введите номер счёта"
                   th:field="*{bankAccountNumber}"
                   required>
        </p>

        <h2 class="details-title">Домашний адрес</h2>

        <p class="form-field">
            <label for="postalCode">Почтовый индекс:</label>
            <input type="text"
                   id="postalCode"
                   th:field="*{address.postalCode}"
                   required>
        </p>

        <p class="form-field">
            <label for="country">Страна:</label>
            <input type="text"
                   id="country"
                   th:field="*{address.country}"
                   required>
        </p>

        <p class="form-field">
            <label for="region">Область:</label>
            <input type="text"
                   id="region"
                   th:field="*{address.region}">
        </p>

        <p class="form-field">
            <label for="district">Район:</label>
            <input type="text"
                   id="district"
                   th:field="*{address.district}">
        </p>

        <p class="form-field">
            <label for="street">Улица:</label>
            <input type="text"
                   id="street"
                   th:field="*{address.street}"
                   required>
        </p>

        <p class="form-field">
            <label for="house">Дом:</label>
            <input type="text"
                   id="house"
                   th:field="*{address.house}"
                   required>
        </p>

        <p class="form-field">
            <label for="apartment">Квартира:</label>
            <input type="text"
                   id="apartment"
                   th:field="*{address.apartment}">
        </p>

        <p class="form-field">
            <label for="cityId">Город:</label>

            <select id="cityId" name="cityId" required>
                <option value="" disabled selected>Выберите город</option>

                <option th:each="city : ${cities}"
                        th:value="${city.id}"
                        th:text="${city.name}">
                </option>
            </select>
        </p>

        <p class="form-actions">
            <input type="submit" value="Отправить">
            <input type="reset" value="Сброс">
        </p>
    </form>

    <p>
        <a class="btn btn-secondary" th:href="@{/customers}">
            Вернуться к списку
        </a>
    </p>
</div>
</body>
</html>
